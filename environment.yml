name: lbd_neuroimmune
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python runtime
  - python=3.10
  - pip

  # Python packages (MAGMA pipeline)
  - pandas>=1.5.0
  - numpy>=1.23.0
  - pyyaml>=6.0

  # R runtime
  - r-base=4.3.1
  - r-essentials

  # R packages via conda (where available)
  - bioconductor-biocmanager>=1.30.20

  # System tools
  - snakemake>=7.32.0
  - graphviz          # for snakemake --dag | dot

  - pip:
    # Pin exact versions for Python packages not available in conda
    - pandas==1.5.3
    - numpy==1.24.3
    - PyYAML==6.0.1
    - argparse==1.4.0
